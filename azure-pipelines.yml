# Azure DevOps reference pipeline. Requires an Azure variable group named
# deployment-settings (see README) and configured service connections.
trigger:
  branches:
    include: [main]

variables:
- group: deployment-settings

stages:
- stage: CI
  jobs:
  - job: BuildAndTest
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'
    - bash: |
        set -euo pipefail
        docker run -d --name hospitality-ci-mongo -p 127.0.0.1:27017:27017 mongo:7
        for attempt in $(seq 1 30); do
          if docker exec hospitality-ci-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then exit 0; fi
          sleep 2
        done
        echo "MongoDB fixture failed to start"
        exit 1
      displayName: Start isolated MongoDB fixture
    - script: |
        set -e
        npm ci
        npm test
        npm run build
      displayName: Install, test, and build
      env:
        MONGO_URI: mongodb://127.0.0.1:27017/nevotek_ci
        API_TOKEN: ci-integration-token-longer-than-24
    - bash: docker rm -f hospitality-ci-mongo || true
      displayName: Remove test database
      condition: always()
    - task: Docker@2
      inputs:
        containerRegistry: $(acrServiceConnection)
        repository: $(imageRepository)
        command: buildAndPush
        Dockerfile: Dockerfile
        tags: |
          $(Build.BuildId)

- stage: Staging
  dependsOn: CI
  jobs:
  - deployment: Deploy
    environment: Staging
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            inputs:
              azureSubscription: $(azureServiceConnection)
              appName: $(webAppName)
              deployToSlotOrASE: true
              resourceGroupName: $(resourceGroup)
              slotName: staging
              containers: $(registryHost)/$(imageRepository):$(Build.BuildId)

- stage: Smoke
  dependsOn: Staging
  jobs:
  - job: CheckReadiness
    pool:
      vmImage: ubuntu-latest
    steps:
    - bash: |
        set -euo pipefail
        curl --fail --silent --show-error \
          --retry 8 --retry-all-errors --retry-delay 5 --max-time 15 \
          "$(stagingUrl)/readyz"
      displayName: Require successful staging readiness

- stage: TesterReview
  dependsOn: Smoke
  jobs:
  - job: CreateJiraIssue
    pool:
      vmImage: ubuntu-latest
    steps:
    - bash: |
        set -euo pipefail
        : "${JIRA_URL:?Missing Jira endpoint}"
        : "${JIRA_AUTH:?Missing Jira API credentials}"
        result=$(curl --fail --silent --show-error --max-time 20 \
          --request POST "$JIRA_URL" \
          --header "Authorization: Basic $JIRA_AUTH" \
          --header 'Content-Type: application/json' \
          --data "$(jq -nc --arg url "$STAGING_URL"             '{fields:{project:{key:"NP"},summary:"Staging ready for review",description:("Test "+$url),issuetype:{name:"Task"}}}')")
        issue_key=$(jq -er '.key | select(length > 0)' <<< "$result")
        echo "Created Jira issue $issue_key"
        echo "##vso[task.setvariable variable=jiraIssueKey;isOutput=true]$issue_key"
      name: create
      displayName: Create Jira approval ticket
      env:
        JIRA_URL: $(jiraIssueUrl)
        JIRA_AUTH: $(jiraBasicAuth)
        STAGING_URL: $(stagingUrl)
    - bash: |
        set -euo pipefail
        for attempt in $(seq 1 12); do
          result=$(curl --fail --silent --show-error --max-time 20 \
            --header "Authorization: Basic $JIRA_AUTH" \
            --header 'Accept: application/json' \
            "$JIRA_URL/$JIRA_ISSUE_KEY")
          status=$(jq -er '.fields.status.name' <<< "$result")
          case "$status" in
            Done)
              echo "Jira review approved"
              exit 0
              ;;
            Rejected)
              echo "Jira review rejected"
              exit 1
              ;;
            *)
              echo "Waiting for Jira review ($attempt/12): $status"
              sleep 300
              ;;
          esac
        done
        echo "Jira review timed out"
        exit 1
      displayName: Wait for tester approval (one-hour maximum)
      env:
        JIRA_URL: $(jiraIssueUrl)
        JIRA_AUTH: $(jiraBasicAuth)
        JIRA_ISSUE_KEY: $(create.jiraIssueKey)

- stage: ApproveProduction
  dependsOn: TesterReview
  jobs:
  - job: Approval
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@0
      inputs:
        notifyUsers: $(reviewerEmails)
        instructions: Review the staging deployment and associated Jira issue; reject if tests fail.
        onTimeout: reject

- stage: Production
  dependsOn: ApproveProduction
  jobs:
  - job: SlotSwap
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: AzureAppServiceManage@0
      inputs:
        azureSubscription: $(azureServiceConnection)
        Action: Swap Slots
        WebAppName: $(webAppName)
        ResourceGroupName: $(resourceGroup)
        SourceSlot: staging
