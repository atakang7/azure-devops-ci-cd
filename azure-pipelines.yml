# Azure DevOps reference pipeline. Requires an Azure variable group named
# deployment-settings (see README) and configured service connections.
trigger:
  branches:
    include: [main]

variables:
- group: deployment-settings

stages:
- stage: CI
  jobs:
  - job: BuildAndTest
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'
    - script: |
        set -e
        npm ci
        npm test
        npm run build
      displayName: Install, test, and build
    - task: Docker@2
      inputs:
        containerRegistry: $(acrServiceConnection)
        repository: $(imageRepository)
        command: buildAndPush
        Dockerfile: Dockerfile
        tags: |
          $(Build.BuildId)

- stage: Staging
  dependsOn: CI
  jobs:
  - deployment: Deploy
    environment: Staging
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            inputs:
              azureSubscription: $(azureServiceConnection)
              appName: $(webAppName)
              slotName: staging
              containers: $(registryHost)/$(imageRepository):$(Build.BuildId)

- stage: Smoke
  dependsOn: Staging
  jobs:
  - job: CheckReadiness
    pool:
      vmImage: ubuntu-latest
    steps:
    - bash: |
        set -euo pipefail
        curl --fail --silent --show-error \
          --retry 8 --retry-all-errors --retry-delay 5 --max-time 15 \
          "$(stagingUrl)/readyz"
      displayName: Require successful staging readiness

- stage: TesterReview
  dependsOn: Smoke
  jobs:
  - job: CreateJiraIssue
    pool:
      vmImage: ubuntu-latest
    steps:
    - bash: |
        set -euo pipefail
        : "${JIRA_URL:?Missing Jira endpoint}"
        : "${JIRA_AUTH:?Missing Jira API credentials}"
        result=$(curl --fail --silent --show-error --max-time 20 \
          --request POST "$JIRA_URL" \
          --header "Authorization: Basic $JIRA_AUTH" \
          --header 'Content-Type: application/json' \
          --data "$(jq -nc --arg url "$STAGING_URL"             '{fields:{project:{key:"NP"},summary:"Staging ready for review",description:("Test "+$url),issuetype:{name:"Task"}}}')")
        issue_key=$(jq -er '.key | select(length > 0)' <<< "$result")
        echo "Created Jira issue $issue_key"
        echo "##vso[task.setvariable variable=jiraIssueKey;isOutput=true]$issue_key"
      name: create
      displayName: Create Jira approval ticket
      env:
        JIRA_URL: $(jiraIssueUrl)
        JIRA_AUTH: $(jiraBasicAuth)
        STAGING_URL: $(stagingUrl)

- stage: ApproveProduction
  dependsOn: TesterReview
  jobs:
  - job: Approval
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@0
      inputs:
        notifyUsers: $(reviewerEmails)
        instructions: Review the staging deployment and associated Jira issue; reject if tests fail.
        onTimeout: reject

- stage: Production
  dependsOn: ApproveProduction
  jobs:
  - job: SlotSwap
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: AzureAppServiceManage@0
      inputs:
        azureSubscription: $(azureServiceConnection)
        Action: Swap Slots
        WebAppName: $(webAppName)
        ResourceGroupName: $(resourceGroup)
        SourceSlot: staging
